name: Build and Push

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::517121893325:role/github-actions-platform
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build Image
        run: |
          IMAGE=517121893325.dkr.ecr.us-east-1.amazonaws.com/alert-copilot
          docker build --platform linux/amd64 -t $IMAGE:${{ github.sha }} .
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          exit-code: '1'
          severity: 'CRITICAL'
          format: 'table'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
    
      - name: SonarQube scan
        run: |
          pip install pysonar
          pysonar \
            --sonar-host-url=${{ secrets.SONAR_HOST_URL }} \
            --sonar-token=${{ secrets.SONAR_TOKEN }} \
            --sonar-project-key=platform-alert-copilot

      - name: Push Image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}